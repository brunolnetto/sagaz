services:
  # PostgreSQL: Core state storage for Sagaz
  postgres:
    image: postgres:18-alpine
    container_name: sagaz-postgres
    environment:
      POSTGRES_DB: sagaz
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # Logical decoding lets the optional CDC stack (profile "cdc") stream the
    # outbox; it only adds a little WAL and changes nothing without a slot.
    command: [ "postgres", "-c", "wal_level=logical" ]
    ports:
      - "5433:5432" # Use 5433 to avoid conflicts with local PostgreSQL
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d sagaz" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis: Used as both Broker and Cache in this simple preset
  redis:
    image: redis:8-alpine
    container_name: sagaz-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Prometheus: Monitoring
  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: sagaz-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  # Grafana: Dashboards
  grafana:
    image: grafana/grafana:13.3.1
    container_name: sagaz-grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      # Auto-provision Prometheus datasource
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      # Auto-provision dashboard provider
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      # Dashboard JSON files
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # ==========================================================================
  # Optional CDC stack (ADR-011): `docker compose --profile cdc up -d`
  # Debezium streams saga_outbox inserts to the Kafka topic
  # sagaz.public.saga_outbox, read by sagaz.integrations.cdc.DebeziumKafkaSource
  # (from the host: bootstrap server localhost:29092).
  # ==========================================================================

  # Kafka: single-node KRaft broker and controller
  kafka:
    image: apache/kafka:4.2.2
    container_name: sagaz-kafka
    profiles: [ "cdc" ]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    ports:
      - "29092:29092"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list" ]
      interval: 10s
      timeout: 10s
      retries: 10

  # Debezium on Kafka Connect: runs the PostgreSQL connector
  connect:
    image: quay.io/debezium/connect:3.7.1.Final
    container_name: sagaz-connect
    profiles: [ "cdc" ]
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: sagaz-connect
      CONFIG_STORAGE_TOPIC: sagaz_connect_configs
      OFFSET_STORAGE_TOPIC: sagaz_connect_offsets
      STATUS_STORAGE_TOPIC: sagaz_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    ports:
      - "8083:8083"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # One-shot: registers (or updates) the outbox connector once Connect is up.
  # The saga_outbox table must exist (created by the outbox storage's
  # initialize()); if it does not yet, re-run:
  #   docker compose --profile cdc up connect-register
  connect-register:
    image: quay.io/debezium/connect:3.7.1.Final
    container_name: sagaz-connect-register
    profiles: [ "cdc" ]
    restart: "no"
    volumes:
      - ./sagaz/deployment/resources/local/postgres/debezium:/debezium:ro
    entrypoint:
      - bash
      - -c
      - |
        until curl -fsS http://connect:8083/connectors > /dev/null; do
          echo "waiting for Kafka Connect..."; sleep 3
        done
        curl -fsS -X PUT -H 'Content-Type: application/json' \
          --data @/debezium/saga-outbox-connector.json \
          http://connect:8083/connectors/sagaz-outbox/config
    depends_on:
      - connect

volumes:
  postgres_data:
