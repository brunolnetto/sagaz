# Read the Docs configuration for sagaz: https://sagaz.readthedocs.io
# See https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

# The site is plain MkDocs: pages, and example files included with pymdownx.snippets.
# It does not import sagaz, so the package is not installed here. The examples are run,
# and their outputs checked, by tests/unit/docs/ in CI.
mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt
