[project]
name = "sagaz"
version = "2.6.0"
description = "Production-ready Saga pattern with DAG support"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "aiofiles>=25.1.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "python-statemachine>=3.2.0,<4",  # phase 2 builds charts with its NestedStateFactory
    "rich>=13.0.0",
    "simple-term-menu>=1.6.0",
    "PyYAML>=6.0.0",
]
requires-python = ">=3.11"

# CLI entry point - allows running 'sagaz' command
[project.scripts]
sagaz = "sagaz.cli:main"

[project.optional-dependencies]
storage = [
    # Storage backends (optional - install as needed)
    "asyncpg>=0.30.0",  # PostgreSQL storage
    "redis>=7.0.0",      # Redis storage  
]
# Demonstrations that start PostgreSQL or Redis in Docker (`sagaz demo`).
demo = ["testcontainers[postgres,redis]>=4.14.2"]
integration-tests = [
    # Integration testing with real databases (requires Docker)
    "testcontainers[kafka,postgres,rabbitmq,redis]>=4.13.0",
    "aioboto3>=12.0.0",
    "zstandard>=0.22.0",  # For S3 snapshot compression
]
redis = [
    "redis>=7.1.0",
]
sqlite = [
    "aiosqlite>=0.19.0",
]
postgres = [
    "asyncpg>=0.31.0",
]
kafka = [
    "aiokafka>=0.12.0",
]
rabbitmq = [
    "aio-pika>=9.0.0",
]
tracing = [
    "opentelemetry-api>=1.45.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.39.1",
    "opentelemetry-sdk>=1.39.1",
]
prometheus = [
    "prometheus-client>=0.23.1",
]
analytics = [
    "duckdb>=1.0.0",
    "sqldim>=2.0.1,<2.1",
    "narwhals>=1.0.0",
]
visualization = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "sse-starlette>=1.0.0",
]
monitor = ["sagaz[visualization]"]
# Gradio monitor of persisted saga assets (ADR-039): sagaz monitor --ui gradio
gradio = ["gradio>=5.25.0"]
# Schema registry serialization of saga events (ADR-014): Avro, JSON Schema
schema-registry = ["confluent-kafka[avro,json,schemaregistry]>=2.10.0"]
aws = [
    "aioboto3>=12.0.0",
    "zstandard>=0.22.0",  # For S3 snapshot compression
]
# Saga analytics from the Iceberg history as Prometheus metrics (ADR-013).
iceberg = [
    "pyiceberg[sql-postgres,sql-sqlite,pyarrow]>=0.9.0",
    "duckdb>=1.0.0",
    "prometheus-client>=0.20.0",
]
# Fluss export (ADR-013). pyfluss 1.0 ships wheels up to CPython 3.12; on 3.13
# install it separately (it builds from source with a Rust toolchain).
fluss = [
    "pyfluss>=1.0.0; python_version < '3.13'",
    "pyarrow>=15.0.0",
]
cdc = [
    "psycopg2-binary>=2.9.9",
    "aiokafka>=0.12.0",
    "httpx>=0.28.1",
]
encryption = [
    "cryptography>=46.0.7",
]
compression = [
    "zstandard>=0.22.0",  # For snapshot compression
]

[dependency-groups]
ai = [
    "langchain-openai>=1.1.14",
    "pydantic>=2.12.5",
    "pydantic-ai>=1.56.0",
]
cli = [
    "click>=8.3.1",
]
dev = [
    # Testing
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "pytest-cov==7.1.0",
    "pytest-xdist>=3.8.0",
    "pytest-watch>=4.2.0",
    # SQLite storage (for unit tests)
    "aiosqlite>=0.19.0",
    # Code Quality
    "ruff>=0.1.6",
    "mypy==2.4.1",
    "ipython>=9.0.0; python_version >= '3.12'",
    # Git Hooks (Rust-based pre-commit alternative - faster and more efficient)
    "prek>=0.2.13",
    # Security
    "bandit[toml]>=1.7.5",
    "pip-audit>=2.6.1",
    "radon>=6.0.1",
    "testcontainers[kafka,postgres,rabbitmq,redis,localstack]>=4.13.3",
    "pytest-timeout>=2.4.0",
    # Django integration tests
    "django>=5.2.17",
    "asgiref>=3.8.0",
    # OpenTelemetry (for tracing tests)
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",
    # Type stubs
    "types-PyYAML>=6.0.0",
    # Framework integrations (for testing)
    "flask>=3.0.0",
    "fastapi>=0.100.0",
    # Visualization dashboard (sagaz[visualization])
    "uvicorn>=0.23.0",
    "sse-starlette>=1.0.0",
    # All optional backends for integration testing
    "asyncpg>=0.30.0",
    "redis>=6.0.0",
    "aiokafka>=0.12.0",
    "aio-pika>=9.0.0",
    "prometheus-client>=0.23.1",
    "httpx>=0.28.1",
    # Per-tenant encryption (sagaz[encryption]) and the CDC pg_logical source (sagaz[cdc])
    "cryptography>=46.0.7",
    "psycopg2-binary>=2.9.9",
    "pytest-json-report>=1.5.0",
    "codebase-stats==0.1.0",
]
django = [
    "django>=5.2.17",
    "asgiref>=3.8.0",  # ASGI support for Django
]
web = [
    # All web framework integrations
    "fastapi>=0.128.0",
    "uvicorn>=0.34.0",
    "flask>=3.1.2",
    "werkzeug>=3.1.9",
    "django>=5.2.17",
    "asgiref>=3.8.0",
]
fastapi = [
    "fastapi>=0.128.0",
    "uvicorn>=0.34.0",  # ASGI server for FastAPI
]
flask = [
    "flask>=3.1.2",
    "werkzeug>=3.1.9",  # WSGI utilities for Flask
]
sqlite = [
    "aiosqlite>=0.22.1",
]

# ============================================================================
# Build System Configuration
# ============================================================================

[build-system]
requires = ["setuptools>=77.0", "wheel"]  # SPDX license expression (PEP 639)
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Explicitly configure package discovery
packages = {find = {where = ["."], include = ["sagaz*"]}}

[tool.setuptools.package-data]
sagaz = [
    "py.typed",
    "deployment/resources/**/*",
    "deployment/resources/**/.*",
    "visualization/static/*",
]

# Downloaded or generated files that git ignores must never ship (the 2.3.0 wheel
# carried a 60 MB Iceberg jar from the local lakehouse). scripts/check_dist.py
# fails the build if any untracked file reaches the wheel or the sdist.
[tool.setuptools.exclude-package-data]
sagaz = [
    "deployment/resources/local/lakehouse/lib/*",
    "**/*.jar",
]

# ============================================================================
# Tool Configurations
# ============================================================================

[tool.ruff]
# Same as Black
line-length = 100
indent-width = 4

# Python 3.11+
target-version = "py311"

# Exclude patterns
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    "alembic/versions/*.py",
]

[tool.ruff.lint]
# Enable pycodestyle (E), Pyflakes (F), isort (I), and more
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T10", # flake8-debugger
    "EM",  # flake8-errmsg
    "ISC", # flake8-implicit-str-concat
    "ICN", # flake8-import-conventions
    "PIE", # flake8-pie
    "T20", # flake8-print
    "PT",  # flake8-pytest-style
    "Q",   # flake8-quotes
    "RSE", # flake8-raise
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "RUF", # Ruff-specific rules
    "PGH", # pygrep-hooks: no blanket "# type: ignore" or "# noqa" (#594)
    "ANN001", # every parameter needs a type (#597)
    "ANN002", # *args needs a type (#596)
    "ANN003", # **kwargs needs a type (#596)
    "ANN201", # every public function needs a return type (#597)
    "ANN202", # ...and every private one
    "ANN204", # ...and every special method
    "ANN205", # ...and every static method
    "ANN206", # ...and every class method
]

ignore = [
    "E501",    # Line too long (handled by formatter)
    "B008",    # Do not perform function calls in argument defaults (FastAPI Depends)
    "ARG002",  # Unused method argument (common in interfaces)
    "ARG001",  # Unused function argument (common in callbacks)
    "PLR0913", # Too many arguments
    "PLR2004", # Magic value used in comparison
    "PLC0415", # Import outside top-level (used for circular import prevention)
    "DTZ005",  # datetime.now() without timezone (we use timezone aware in production)
    "G004",    # Logging f-string (more readable than %)
    "B904",    # Raise without from inside except (sometimes intentional)
    "PT011",   # pytest.raises too broad (sometimes necessary)
    "PT001",   # pytest.fixture() vs pytest.fixture (formatter adds parens back)
    "PT023",   # pytest.mark decorators (formatter adds parens back)
    "ISC001",  # Implicit string concatenation (conflicts with formatter)
    "ERA001",  # Commented out code (useful during development)
    "N802",    # Function name should be lowercase (lazy import factory functions)
    "B024",    # Abstract base class with no abstract methods (intentional for listeners)
    "B027",    # Empty method in ABC without abstract decorator (default implementations)
    "RUF012",  # Mutable class attributes without ClassVar (intentional for configs)
    "B039",    # ContextVar mutable default (intentional pattern)
    "SIM105",  # Use contextlib.suppress (explicit try-except more readable)
    "SIM117",  # Nested with statements (clearer for async db transactions)
]

[tool.ruff.lint.isort]
known-first-party = ["sagaz"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.flake8-annotations]
# ``*args: Any`` / ``**kwargs: Any`` is the idiom for arguments passed through to another
# call, so it does not count as a bare Any (ANN401).
allow-star-arg-any = true

[tool.ruff.lint.per-file-ignores]
# Allow print statements in CLI scripts
"scripts/*" = ["T20"]
# Allow print statements in example demo scripts
"examples/*.py" = ["T20", "I001", "F541"]
"examples/*/*.py" = ["T20", "I001", "F541"]
"examples/*/*/*.py" = ["T20", "I001", "F541"]
# Documentation examples print their output and stay free of annotations, to read easily
"docs/*/code/*.py" = ["T20", "ANN", "EM"]
"sagaz/examples/*/demo.py" = ["T20"]
"sagaz/examples/*/*/demo.py" = ["T20"]
# Allow print statements in built-in demonstration modules
"sagaz/demonstrations/*" = ["T20"]
"sagaz/cli/demonstrations.py" = ["T20"]
# Allow unused imports in __init__.py (re-exports)
"__init__.py" = ["F401", "N802"]
# Sagaz source - allow specific patterns
"sagaz/*" = [
    "F401",     # Unused imports for availability checks
]
# Factory files have intentional print_available_* functions
"sagaz/*/factory.py" = ["T20"]
"sagaz/*/*/factory.py" = ["T20"]
# Tests can have magic values, print statements, test-specific patterns
"tests/*" = [
    "ANN",      # Tests are not type-checked: fakes and fixtures may go unannotated
    "PLR2004",  # Magic values in tests
    "T20",      # Print statements for debugging
    "ARG",      # Unused arguments in fixtures
    "PT012",    # Multi-statement pytest.raises blocks (common test pattern)
    "PT017",    # Assertion on exception in except block
    "B017",     # Blind except for testing immutability/errors
    "B015",     # Pointless comparison for testing operators
    "B018",     # Useless attribute access (for coverage)
    "B023",     # Loop variable binding (common in dynamic test generation)
    "E402",     # Module level import not at top (docstrings before imports)
    "E722",     # Bare except (for cleanup in tests)
    "E741",     # Ambiguous variable name (short names in comprehensions)
    "N806",     # Variable should be lowercase (mock class names)
    "F401",     # Unused imports for availability checks
    "F811",     # Redefinition (test method overrides)
    "SIM102",   # Nested ifs for clarity
    "SIM105",   # Try-except-pass for optional operations
    "SIM117",   # Nested with statements (more readable in tests)
    "PTH123",   # open() vs Path.open() (simpler in tests)
    "RUF",      # Ruff-specific rules in tests (regex patterns, etc.)
]

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"

# Indent with spaces
indent-style = "space"

# Respect magic trailing commas
skip-magic-trailing-comma = false

# Auto-detect line endings
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
# Every definition is annotated (#597): a new one without types is an error.
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
# An ignore that silences nothing is reported, so stale ones cannot pile up (#594). An
# optional import must need no ignore whether or not its extra is installed: import it
# under ``if TYPE_CHECKING:`` and do the try/except in the ``else:`` branch.
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
ignore_missing_imports = true
explicit_package_bases = true
namespace_packages = true

# Exclude patterns
exclude = [
    "alembic/",
    "tests/",
    ".venv/",
]

# ============================================================================
# Typing budget (scripts/check_typing_budget.py)
# ============================================================================
# How many findings each measure has today, over sagaz/ without the examples. CI fails
# when a count differs: above, debt was added; below, lower the number here so the gain
# is kept. ANN401 is the one annotation rule not enabled yet (#595).
[tool.sagaz.typing-budget]
ANN401 = 290        # a bare Any as a whole annotation
"type-ignore" = 47  # "# type: ignore" comments

# ============================================================================
# Pytest Configuration
# ============================================================================

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Parallel execution with pytest-xdist
# Run tests with: pytest -n auto --dist=loadgroup (respects xdist_group markers)
# Use --dist=loadgroup to share containers across tests with same xdist_group
# Exclude slow/container tests by default - run with: pytest -m integration
addopts = "-m 'not performance and not stress and not integration'"

# Register custom markers
markers = [
    "integration: marks tests as integration tests (require Docker/external services)",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "xdist_group(name): marks tests to run on same worker (for shared state)",
    "performance: marks tests as performance/throughput tests",
    "stress: marks tests as stress/endurance tests (long-running)",
    "chaos: marks tests as chaos engineering tests",
]

# Filter warnings from external libraries
filterwarnings = [
    "error",  # Treat warnings as errors by default
    # Ignore deprecation warnings from testcontainers
    "ignore:The @wait_container_is_ready decorator is deprecated:DeprecationWarning:testcontainers",
    "ignore:The wait_for_logs function with string or callable predicates is deprecated:DeprecationWarning:testcontainers",
    # Ignore RuntimeWarning from statemachine library
    "ignore:coroutine 'sleep' was never awaited:RuntimeWarning:statemachine",
    # Ignore RuntimeWarning from stdlib (caused by statemachine)
    "ignore:coroutine 'sleep' was never awaited:RuntimeWarning",
    # Ignore unawaited AsyncMock coroutines from our tests
    "ignore:coroutine 'AsyncMockMixin._execute_mock_call' was never awaited:RuntimeWarning",
    # Ignore unknown mark warning during collection (marker is registered but order matters)
    "ignore::pytest.PytestUnknownMarkWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

# ============================================================================
# Coverage Configuration
# ============================================================================

[tool.coverage.run]
source = ["sagaz"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "sagaz/__init__.py",
    "sagaz/*/__init__.py",
    # Examples are bundled but not library code
    "sagaz/examples/*",
    # CLI tools - interactive wrappers, not core library logic
    "sagaz/cli.py",
    "sagaz/cli_app.py",
    "sagaz/cli/main.py",  # CLI entry point - thin wrapper
    # Split out of the omitted cli/examples.py and cli/dry_run.py (1.8.2)
    "sagaz/cli/_examples_discovery.py",
    "sagaz/cli/_examples_menu.py",
    "sagaz/cli/_examples_runner.py",
    "sagaz/cli/_dry_run_display.py",
    "sagaz/cli/_dry_run_discovery.py",
    # Optional integrations requiring external frameworks
    "sagaz/integrations/django.py",
    "sagaz/integrations/_django_webhooks.py",
    # Optional trigger sources requiring external services
    "sagaz/triggers/sources/broker.py",
    "sagaz/triggers/sources/cron.py",
]

[tool.coverage.html]
directory = "htmlcov"



# Structural quality gate: `make quality-gate` and the quality-gates CI workflow.
# Every module under sagaz/ must stay within these limits (no baseline: zero
# violations since 1.8.2).
[tool.codebase-stats.gates]
max-cc = 10
max-lines = 400
min-mi = 20
