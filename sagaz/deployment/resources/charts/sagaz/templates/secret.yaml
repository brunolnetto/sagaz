{{- if include "sagaz.createSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sagaz.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sagaz.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if not .Values.database.existingSecret }}
  database-url: {{ .Values.database.url | b64enc | quote }}
  {{- end }}
  {{- if not .Values.broker.existingSecret }}
  broker-url: {{ .Values.broker.url | b64enc | quote }}
  {{- end }}
  {{- if and (include "sagaz.pgLogical" .) .Values.outbox.cdc.pgLogical.dsn (not .Values.outbox.cdc.pgLogical.existingSecret) }}
  cdc-dsn: {{ .Values.outbox.cdc.pgLogical.dsn | b64enc | quote }}
  {{- end }}
{{- end }}
