global:
  scrape_interval: 15s

scrape_configs:
  # sagaz analytics metrics: the flow summary of the Iceberg history.
  - job_name: sagaz-flows
    static_configs:
      - targets: ["host.docker.internal:9464"]
  # sagaz analytics export --metrics-port 9465: the exporter's progress.
  - job_name: sagaz-export
    static_configs:
      - targets: ["host.docker.internal:9465"]
