name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  CI: true
  PYTHONDONTWRITEBYTECODE: 1

jobs:
# ─── Unit and Integration Tests ────────────────────────────────────────────────

  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        # The analytics extra (duckdb, sqldim): without it the analytics tests skip.
        run: uv sync --group dev --extra analytics --extra fluss --extra iceberg --extra gradio --extra schema-registry

      - name: Run unit tests with coverage
        run: |
          uv run pytest tests/ \
            --cov=sagaz \
            --cov-report=xml:coverage.xml \
            --cov-report=json:coverage.json \
            --cov-report=term-missing \
            --cov-fail-under=95 \
            --junitxml=junit.xml \
            -o junit_family=legacy \
            -m "not integration" \
            -n auto \
            --tb=short \
            -q

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13' && !cancelled()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: py${{ matrix.python-version }}
          fail_ci_if_error: false
          verbose: true

      - name: Upload test results to Codecov
        if: matrix.python-version == '3.13' && !cancelled()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./junit.xml
          report_type: test_results
          fail_ci_if_error: false

      - name: Upload coverage.json for the coverage gate
        # codebase-stats reads this in the coverage-gate job below (#603).
        if: matrix.python-version == '3.13' && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-json
          path: coverage.json
          if-no-files-found: error
          retention-days: 7

  coverage-gate:
    name: Coverage Gate (codebase-stats)
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Download coverage.json
        uses: actions/download-artifact@v7
        with:
          name: coverage-json

      - name: Coverage report and gate
        # The project coverage and the files to cover first, from the unit tests' data.
        # --min-coverage matches pytest's --cov-fail-under above; with it, a missing or
        # empty coverage file fails the gate ("not evaluated") instead of passing.
        # The sizes, complexity and maintainability gates run in quality-gates.yml.
        run: |
          uv run codebase-stats --root sagaz --coverage coverage.json \
            --only coverage,lowcov --min-coverage 95 --format summary-md >> "$GITHUB_STEP_SUMMARY"

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      docker:
        image: docker:dind
        options: --privileged

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies (with integration test deps)
        run: uv sync --group dev --extra integration-tests --extra analytics --extra fluss --extra iceberg --extra schema-registry

      - name: Run integration tests
        run: |
          uv run pytest tests/ \
            --cov=sagaz \
            --cov-report=xml:coverage-integration.xml \
            --junitxml=junit-integration.xml \
            -o junit_family=legacy \
            -m "integration" \
            --tb=short \
            -v

      - name: Upload integration coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-integration.xml
          flags: integration
          name: integration-tests

# ─── Performance Benchmarks ───────────────────────────────────────────────────

  benchmark:
    name: "Run Benchmarks"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: |
          source .venv/bin/activate
          uv pip install -e ".[prometheus]"
          uv sync --group dev

      - name: Run benchmark (local profile)
        id: perf_local
        run: |
          source .venv/bin/activate
          sagaz benchmark --profile local --output bench-local.json
        continue-on-error: true

      - name: Run benchmark (stress profile)
        if: github.event_name == 'schedule' || github.event.inputs.config == 'production'
        run: |
          source .venv/bin/activate
          sagaz benchmark --profile stress --output bench-stress.json
        continue-on-error: true

      - name: Summarize benchmark
        if: always()
        run: |
          source .venv/bin/activate
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          print("## Saga benchmark")
          print("| Profile | Storage | Sagas | Concurrency | Failed | Sagas/s | p50 ms | p95 ms | p99 ms |")
          print("|---|---|---:|---:|---:|---:|---:|---:|---:|")
          for name in ("bench-local.json", "bench-stress.json"):
              path = pathlib.Path(name)
              if not path.exists():
                  continue
              for r in json.loads(path.read_text())["results"]:
                  print(f"| {r['profile']} | {r['storage']} | {r['sagas']} | {r['concurrency']} | "
                        f"{r['failed']} | {r['throughput']} | {r['p50_ms']} | {r['p95_ms']} | {r['p99_ms']} |")
          PY

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: bench-*.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Check for regressions
        run: |
          source .venv/bin/activate
          python - <<'PY'
          import json, pathlib, sys
          path = pathlib.Path("bench-local.json")
          if not path.exists():
              sys.exit("::error::benchmark produced no results")
          (result,) = json.loads(path.read_text())["results"]
          if result["failed"]:
              sys.exit(f"::error::{result['failed']} saga(s) failed during the benchmark")
          if result["throughput"] < 30:
              sys.exit(f"::error::Performance regression: {result['throughput']} sagas/sec (min: 30)")
          print(f"Performance check passed: {result['throughput']} sagas/sec")
          PY
