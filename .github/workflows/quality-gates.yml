name: Quality Gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run weekly on Sundays at midnight
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      config:
        description: 'Test configuration (local/production)'
        required: false
        default: 'local'

env:
  CI: true
  PYTHONDONTWRITEBYTECODE: 1

jobs:

# ─── Lint & Format ────────────────────────────────────────────────────────────

  lint:
    name: Lint & Format (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.10"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run ruff linter
        run: uv run ruff check sagaz/ tests/ --output-format=github

      - name: Run ruff formatter check
        run: uv run ruff format --check sagaz/ tests/

      - name: Check documentation links
        run: uv run python scripts/check_doc_links.py

      - name: Install optional dependencies for type checking
        run: uv pip install redis aio-pika aiokafka prometheus_client asyncpg

      - name: Check the feature matrix's cited tests
        run: uv run python scripts/check_feature_matrix.py

      - name: Check the release documents against the project's version
        # The feature matrix, the roadmap and the release plan name one released version (#642).
        run: uv run python scripts/check_release_docs.py

      - name: Check documented imports
        # Every `from sagaz... import ...` in README.md and docs/ must import (#539).
        run: uv run python scripts/check_doc_imports.py

      - name: Check suppression comments
        # "# type: ignore", "# noqa", "# nosec" and "# pragma: no cover" must each name
        # what they suppress and why (#594).
        run: uv run python scripts/check_suppressions.py

      - name: Check the typing budget
        # Counts of bare Any, missing annotations and type: ignore must match the budget in
        # pyproject.toml: they can only go down (#595).
        run: uv run python scripts/check_typing_budget.py

      - name: Run mypy type checker
        # Gates. Unused ignores fail too (warn_unused_ignores in pyproject.toml).
        run: uv run mypy sagaz/ --ignore-missing-imports

# ─── Commit Linting ───────────────────────────────────────────────────────────

  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'dependabot/') && !startsWith(github.head_ref, 'renovate/') && !(github.head_ref == 'develop' && github.base_ref == 'main') && !startsWith(github.head_ref, 'release/') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - run: npm ci

      - name: Lint commit messages in PR
        run: |
          npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

# ─── Security ─────────────────────────────────────────────────────────────────

  security:
    name: Security Checks
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.10"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run bandit security linter
        run: |
          uv run bandit -r sagaz/ -c pyproject.toml -f sarif -o bandit-results.sarif 2>/dev/null || true
          if [ ! -f bandit-results.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json","runs":[{"tool":{"driver":{"name":"Bandit","version":"1.7.5"}},"results":[]}]}' > bandit-results.sarif
          fi

      - name: Upload bandit results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: bandit-results.sarif
          category: bandit
        continue-on-error: true

      - name: Gate on bandit findings (medium severity and up)
        # A false positive takes an inline "# nosec <rule> - <reason>".
        run: uv run bandit -r sagaz/ -c pyproject.toml -ll -q

      - name: Run pip-audit for vulnerabilities
        # Gates: a dependency with a known advisory fails the build. To accept one that has
        # no fix yet, add --ignore-vuln <ID> here with a comment saying why.
        # The locked dependencies are audited, without the project: sagaz itself is not on
        # PyPI at a version being prepared, and --strict fails on a package it cannot audit.
        run: |
          uv export --frozen --no-emit-project --group dev --format requirements-txt -o audit-requirements.txt -q
          uv run pip-audit --strict --require-hashes --disable-pip -r audit-requirements.txt --progress-spinner=off

# ─── Code Quality (CodeQL + Cyclomatic Complexity) ───────────────────────────

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-and-quality
          config: |
            paths:
              - sagaz
            paths-ignore:
              - tests
              - examples
              - docs

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"

  complexity:
    name: Code Complexity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.10"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Report full complexity breakdown
        run: |
          echo "### Cyclomatic Complexity Report ###"
          uv run radon cc --show-complexity --average sagaz/

      - name: Track A-grade violations (B+ complexity — roadmap target)
        # Standard: all functions must be A-grade (CC ≤ 5).
        # Currently non-blocking while the backlog of existing B-grade violations is cleared.
        # Roadmap: once all B-grade violations are resolved, set continue-on-error to false.
        run: |
          echo "### B-grade and above (A-grade standard violations) ###"
          result=$(uv run radon cc --min B sagaz/ 2>&1)
          if [ -n "$result" ]; then
            count=$(echo "$result" | grep -cE '^\s+(M|F|C) ' || true)
            echo "::warning::$count function(s) have B-grade or higher complexity (CC ≥ 6)."
            echo "Refactor these to reach the A-grade standard (CC ≤ 5) — see roadmap in issue #90."
            echo "$result"
          else
            echo "✅ All functions are A-grade (CC ≤ 5). Standard achieved!"
          fi
        continue-on-error: true  # Non-blocking until all B-grade violations are resolved

      - name: Enforce no C-grade or higher (strict gate)
        # Any function with CC ≥ 10 (grade C) is a hard blocker.
        # This gate will be tightened to B-grade once the A-grade backlog is cleared.
        run: |
          echo "### Strict gate: no C-grade (CC ≥ 10) ###"
          result=$(uv run radon cc --min C sagaz/ 2>&1)
          if [ -n "$result" ]; then
            echo "::error::Found function(s) with C-level or higher complexity (CC ≥ 10)."
            echo "Reduce cyclomatic complexity before merging."
            echo "$result"
            exit 1
          fi
          echo "No C-grade violations found."

      - name: Structural quality gate (codebase-stats)
        # Limits live in [tool.codebase-stats.gates] (pyproject.toml): CC <= 10 per
        # function, <= 400 lines and maintainability index >= 20 per module.
        # Exits 1 with "GATE FAILED" on any violation; the summary goes to the job page.
        # Coverage is reported and gated after the unit tests, where its data is:
        # the coverage-gate job of test-gates.yml (#603).
        run: uv run codebase-stats --root sagaz --only sizes,cc,mi --format summary-md >> "$GITHUB_STEP_SUMMARY"

      - name: Check maintainability index
        run: |
          echo "### Maintainability Index ###"
          uv run radon mi sagaz/ --show
          result=$(uv run radon mi sagaz/ --min C 2>&1)
          if echo "$result" | grep -qE "^sagaz"; then
            echo "::warning::Some files have low maintainability index"
            echo "$result"
          fi
