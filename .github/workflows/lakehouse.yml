name: Lakehouse

# The v2.2.0 release gates of ADR-013 (#484), end to end: the saga log exported
# to Fluss 1.0, tiered to Iceberg on S3 by Flink, and read back.
# Heavy (about 6 GB of images), so it runs when the export path changes, daily,
# and on demand.

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "sagaz/core/storage/saga_log/**"
      - "sagaz/integrations/fluss.py"
      - "sagaz/integrations/iceberg_metrics.py"
      - "sagaz/integrations/flink_sql.py"
      - "sagaz/choreography/tracker.py"
      - "sagaz/deployment/resources/local/lakehouse/**"
      - "tests/integration/test_lakehouse_e2e.py"
      - ".github/workflows/lakehouse.yml"
  push:
    branches: [main, develop]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  CI: true
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  gates:
    name: Lakehouse release gates (${{ matrix.reader }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # cursor: a SQLite log polled with SagaLogReader;
        # cdc: a PostgreSQL log streamed through logical replication (#495).
        reader: [cursor, cdc]
    defaults:
      run:
        working-directory: sagaz/deployment/resources/local/lakehouse

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"  # pyfluss 1.0 ships wheels up to 3.12

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.10"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        working-directory: .
        run: uv sync --python 3.12 --group dev --extra analytics --extra fluss --extra iceberg --extra cdc

      - name: Start the lakehouse
        run: |
          ./fetch-jars.sh
          docker compose up -d --wait --wait-timeout 300

      - name: Wait for Fluss and Flink
        run: |
          for port in 9124 9125 8083; do
            timeout 180 bash -c "until (exec 3<>/dev/tcp/localhost/$port) 2>/dev/null; do sleep 2; done"
          done

      - name: Submit the tiering job
        run: docker compose exec -T jobmanager /opt/flink/tiering.sh

      - name: Run the release gates
        working-directory: .
        env:
          SAGAZ_TEST_LAKEHOUSE: "1"
          SAGAZ_LAKEHOUSE_SAGAS: "1000"
          SAGAZ_LAKEHOUSE_READER: ${{ matrix.reader }}
        run: uv run pytest tests/integration/test_lakehouse_e2e.py -v -s --tb=short -p no:randomly

      - name: Service logs
        if: failure()
        run: docker compose logs --tail 200

      - name: Stop the lakehouse
        if: always()
        run: docker compose down -v
